<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hackathon Project Delivery logo</title>
  <desc id="desc">A square logo for the Huiyoung Hackathon Project Delivery skill, showing delivery gates converging into a public demo path.</desc>
  <defs>
    <linearGradient id="field" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5ead7"/>
      <stop offset=".48" stop-color="#8bc7a0"/>
      <stop offset="1" stop-color="#1f5749"/>
    </linearGradient>
    <linearGradient id="path" x1="106" y1="346" x2="408" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b85f49"/>
      <stop offset=".5" stop-color="#c58a33"/>
      <stop offset="1" stop-color="#5daec2"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#171411" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="92" fill="#171411"/>
  <rect x="22" y="22" width="468" height="468" rx="76" fill="url(#field)"/>
  <path d="M66 382c95-90 169-132 263-134 51-1 89-17 120-56-6 72-57 118-151 140-80 19-151 44-232 103z" fill="#171411" opacity=".18"/>

  <g filter="url(#shadow)">
    <path d="M120 358c48-60 91-98 139-116 54-21 102-18 154-82" fill="none" stroke="url(#path)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="120" cy="358" r="31" fill="#fffdf7" stroke="#b85f49" stroke-width="8"/>
    <circle cx="258" cy="242" r="36" fill="#fffdf7" stroke="#c58a33" stroke-width="8"/>
    <circle cx="412" cy="160" r="31" fill="#fffdf7" stroke="#5daec2" stroke-width="8"/>
  </g>

  <text x="256" y="300" text-anchor="middle" fill="#171411" font-family="'Segoe UI', Arial, sans-serif" font-size="60" font-weight="900" letter-spacing="0">HPD</text>
  <text x="256" y="335" text-anchor="middle" fill="#235a49" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" letter-spacing="0">Huiyoung Skill</text>
  <path d="M161 386h190" stroke="#fffdf7" stroke-width="8" stroke-linecap="round" opacity=".78"/>
</svg>
